[project]
name = "datafiltr"
version = "0.1.0"
description = "Aplicacion local para gestionar informacion de empresas a partir de archivos Excel"
requires-python = ">=3.11,<3.13"
dependencies = [
	"fastapi==0.115.0",
	"uvicorn[standard]==0.30.6",
	"pandas==2.2.3",
	"openpyxl==3.1.5",
	"pydantic==2.9.2",
	"python-multipart==0.0.9",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
